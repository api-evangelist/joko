aid: joko
name: Joko
description: 'Joko is a French fintech company operating a consumer cashback, rewards, and
  savings application that connects shoppers with more than 3,500 partner brands online and in
  physical stores. Users earn cashback and automatically apply promo codes through the Joko iOS
  and Android apps and browser extensions (Chrome, Firefox, Safari), while also managing budgets,
  loyalty cards, gift cards, and split (3x installment) payments. Joko also runs a business
  solution offering brand partnerships and consumer market research. Backed by Partech, Joko is
  tracked in the API Evangelist network as a company profile; it publishes no public developer
  API, developer portal, or API documentation at this time.'
